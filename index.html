<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>МОГНУТЬ 6-7 — школьный фонк-раннер</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta name="sigma67-style" content="1">
<style>
/* Раскладка игрового поля.
   Игра запускается внутри iframe ВКонтакте и Яндекс Игр, а его размер заранее неизвестен.
   Поэтому поле занимает весь доступный прямоугольник и центрируется, а жёсткие 1280x720
   из шаблона Unity перебиваются. Футер шаблона скрыт: на его месте кнопка «на весь экран». */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #08040f;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#unity-container,
#unity-container.unity-desktop,
#unity-container.unity-mobile {
  position: fixed;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  transform: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
#unity-fullscreen-container,
.unity-mobile #unity-fullscreen-container {
  position: absolute;
  left: 0;
  top: 0;
  width: 100% !important;
  height: 100% !important;
}
#unity-canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: #1F1F20;
  outline: none;
}
#unity-loading-container {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
}
#unity-footer {
  display: none !important;
}
#sigma67-fs {
  position: absolute;
  right: 10px;
  top: 10px;
  z-index: 30;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 10px;
  background: rgba(12, 6, 24, .55);
  color: #ffe9a8;
  font: 700 22px/44px system-ui, sans-serif;
  cursor: pointer;
  opacity: .65;
  transition: opacity .15s, background .15s;
}
#sigma67-fs:hover {
  opacity: 1;
  background: rgba(12, 6, 24, .85);
}
#sigma67-fs.on {
  opacity: 1;
  color: #fff;
  background: rgba(255, 60, 120, .35);
}
#unity-warning {
  position: absolute;
  left: 50%;
  top: 5%;
  transform: translateX(-50%);
  background: #fff;
  padding: 10px;
  display: none;
  z-index: 40;
}
</style>
  <meta name="sigma67-meta" content="1">
  <meta name="description" content="Могни 6-7: лови ауру, уворачивайся от скуфов и училки, включай режим 6-7 и жми МОГНУТЬ. Бесплатный фонк-раннер.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#08040f">
  <meta property="og:title" content="МОГНУТЬ 6-7">
  <meta property="og:description" content="Школьный фонк-раннер: аура, скуфы и кнопка МОГНУТЬ.">
  <meta property="og:image" content="cover_800x470.png">
  <meta name="sigma67-bridge" content="1">
  <!-- VK Bridge: только локальная копия, внешний CDN в ВК ненадёжен -->
  <script src="browser.min.js"></script>
  <script>if(window.vkBridge){window.vkBridge.send('VKWebAppInit').catch(function(e){console.error('VKWebAppInit',e);});}</script>
</head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">MOGNUT 6-7</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/VK.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/VK.data.unityweb",
        frameworkUrl: buildUrl + "/VK.framework.js.unityweb",
        codeUrl: buildUrl + "/VK.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "Sigma67 Games",
        productName: "MOGNUT 6-7",
        productVersion: "1.0-20261014-1904",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "1280px";
        fullscreenContainer.style.height = "720px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  <script>
/* Кнопка «на весь экран».
   В Контакте игра живёт в iframe, и разворот разрешён не во всех окружениях
   (в мобильном приложении ВК игра и так занимает весь экран). Поэтому при отказе
   показываем понятную подсказку, а не молчим: молчащая кнопка выглядит как баг. */
(function () {
  var container = document.getElementById("unity-fullscreen-container") || document.documentElement;

  function fsEl() {
    return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
  }

  /* Просим разворот у того элемента, который Unity считает корнем игры:
     так canvas гарантированно растягивается на весь экран. */
  function ask() {
    var el = container;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!fn) {
      el = document.documentElement;
      fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    }
    return fn ? fn.call(el) : null;
  }

  function leave() {
    var fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (fn) fn.call(document);
  }

  function hint(text) {
    if (typeof unityShowBanner === "function") unityShowBanner(text, "warning");
    console.warn("[sigma67] " + text);
  }

  var btn = document.createElement("button");
  btn.id = "sigma67-fs";
  btn.type = "button";
  btn.title = "На весь экран (F)";
  btn.setAttribute("aria-label", "Развернуть игру на весь экран");
  btn.innerHTML = "&#9974;";
  document.body.appendChild(btn);

  function toggle() {
    if (fsEl()) {
      try { leave(); } catch (e) { }
      return;
    }
    var p = null;
    try { p = ask(); } catch (e) { p = null; }
    if (!p || typeof p.then !== "function") {
      hint("Это окно не умеет открывать игру на весь экран — откройте её в отдельной вкладке браузера.");
      return;
    }
    p.then(function () {
      btn.classList.add("on");
    }).catch(function () {
      btn.classList.remove("on");
      hint("ВКонтакте не разрешил разворот на весь экран: игра и так занимает всё окно. " +
           "Полный экран работает, если открыть игру в браузере отдельной вкладкой.");
    });
  }

  btn.addEventListener("click", function (e) {
    e.preventDefault();
    toggle();
  });

  function sync() {
    btn.classList.toggle("on", !!fsEl());
  }
  document.addEventListener("fullscreenchange", sync);
  document.addEventListener("webkitfullscreenchange", sync);
  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "f" || k === "F" || k === "\u0430" || k === "\u0410") toggle();
  });
})();
</script>
</body>
</html>
